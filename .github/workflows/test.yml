on: [push]

jobs:
  ci:
    name: ${{ matrix.cmd }} (${{ matrix.os }}, ${{ matrix.assembly }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        cmd: [build, test]
        assembly: [default, no_assembly]
    steps:
    - uses: actions/checkout@v6

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Run Makefile
      run: |
        FLAGS=""

        # Apply static analysis exclusively on Linux builds
        if [ "${{ matrix.os }}" = "ubuntu-26.04" ] && [ "${{ matrix.cmd }}" = "build" ]; then
          FLAGS="-fanalyzer"
        fi

        # Append assembly override if matrix dictates
        if [ "${{ matrix.assembly }}" = "no_assembly" ]; then
          FLAGS="$FLAGS -DNO_ASSEMBLY"
        fi

        make ${{ matrix.cmd }} FLAGS_EXTRA="$FLAGS"

  all_checks_passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - run: echo "All matrix jobs completed successfully."
